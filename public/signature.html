<!-- ============================================================

     your mail client's signature editor. Do not paste the source.

     render only for recipients who have them installed locally.
     Everyone else gets the fallback stack, which is what this design
     is tuned for. Do not add font-face rules; clients strip them and
     the preview would stop telling the truth.
