<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Michael Steve Email Signature</title>
</head>
<body bgcolor="#F7F7FB" style="background-color:#F7F7FB; margin:0; padding:24px;">

<!-- ============================================================
     EMAIL SIGNATURE. Select all on this page, copy, paste into
     your mail client's signature editor. Do not paste the source.

     FONTS. Email cannot load web fonts, so Inter renders only for
     recipients who have it installed locally. Everyone else gets the
     fallback stack, which is what this design is tuned for. Do not add
     font-face rules; clients strip them and the preview would stop
     telling the truth.

       Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif

     One stack throughout. Hierarchy comes from size, weight, letter
     spacing and colour, not from a second typeface. Keep the fallbacks
     metrically similar to Inter so the name does not jump width when
     Inter is absent.
     ============================================================ -->

<table border="0" cellpadding="0" cellspacing="0" width="500" style="border-collapse:collapse; width:500px; max-width:500px;">

  <!-- ---------- IDENTITY ---------- -->
  <tr>
    <td style="padding:0;">
      <table border="0" cellpadding="0" cellspacing="0" width="500" style="border-collapse:collapse; width:500px;">
        <tr>
          <td width="72" valign="top" style="width:72px; padding:0;">
            <a href="https://michaelsteve.com" target="_blank" style="text-decoration:none;"><img src="https://michaelsteve.com/icon-192.png" width="72" height="72" alt="Michael Steve Clarity Studio" style="display:block; border:0; outline:none; text-decoration:none; width:72px; height:72px;"></a>
          </td>
          <td width="18" style="width:18px; padding:0; font-size:1px; line-height:1px;">&nbsp;</td>
          <td width="410" valign="top" style="width:410px; padding:0;">
            <table border="0" cellpadding="0" cellspacing="0" width="410" style="border-collapse:collapse; width:410px;">
              <tr>
                <td style="padding:0 0 5px 0; font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:24px; line-height:27px; font-weight:bold; letter-spacing:0.2px; color:#00034C;">Michael Steve</td>
              </tr>
              <tr>
                <td style="padding:0 0 7px 0; font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:15px; font-weight:bold; letter-spacing:1.4px; color:#6368DA;">AI CLARITY CONSULTANT</td>
              </tr>
              <tr>
                <td style="padding:0; font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; line-height:18px; color:#3F4157;">Michael Steve Clarity Studio</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- ---------- SPACER ---------- -->
  <tr>
    <td height="15" style="height:15px; padding:0; font-size:1px; line-height:15px;">&nbsp;</td>
  </tr>

  <!-- ---------- DIVIDER ---------- -->
  <tr>
    <td height="1" bgcolor="#DCDDEC" style="height:1px; background-color:#DCDDEC; padding:0; font-size:1px; line-height:1px;">&nbsp;</td>
  </tr>

  <!-- ---------- SPACER ---------- -->
  <tr>
    <td height="15" style="height:15px; padding:0; font-size:1px; line-height:15px;">&nbsp;</td>
  </tr>

  <!-- ---------- CONTACT ----------
       One item per line, stacked as table rows rather than line breaks,
       so spacing stays under cell-padding control in Outlook.
       Social links were removed until those profiles carry content; add
       them back as plain text links here, never as icon images. -->
  <tr>
    <td style="padding:0;">
      <table border="0" cellpadding="0" cellspacing="0" width="500" style="border-collapse:collapse; width:500px;">
        <tr>
          <td style="padding:0 0 4px 0; font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; line-height:19px; color:#3F4157;"><a href="mailto:partner@michaelsteve.com" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; line-height:19px; color:#010579; text-decoration:none;">partner@michaelsteve.com</a></td>
        </tr>
        <tr>
          <td style="padding:0; font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; line-height:19px; color:#3F4157;"><a href="https://michaelsteve.com" target="_blank" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; line-height:19px; color:#010579; text-decoration:none;">michaelsteve.com</a></td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- ---------- SPACER ---------- -->
  <tr>
    <td height="18" style="height:18px; padding:0; font-size:1px; line-height:18px;">&nbsp;</td>
  </tr>

  <!-- ---------- BANNER ----------
       Sole call to action. The banner is the only promotional element;
       recipients already in a thread reply directly instead. -->
  <tr>
    <td style="padding:0;">
      <a href="https://aistakeholderchallenge.com" target="_blank" style="text-decoration:none;"><img src="https://michaelsteve.com/aisc-signature-banner.jpg" width="250" height="62" alt="AI Stakeholder Challenge, a seven day AI leadership program" style="display:block; border:0; outline:none; text-decoration:none; width:250px; height:62px;"></a>
    </td>
  </tr>

</table>

</body>
</html>
